name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - nonprod
          - prod
      confirmation:
        description: "Enter apply-<environment> to authorize apply"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.environment || 'nonprod' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: terraform/environments/${{ inputs.environment || 'nonprod' }}
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

jobs:
  validate:
    name: Terraform validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Check formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize without remote state
        run: terraform -chdir="$TF_WORKING_DIR" init -backend=false -input=false

      - name: Validate configuration
        run: terraform -chdir="$TF_WORKING_DIR" validate

  plan:
    name: Terraform plan
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'nonprod' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize HCP Terraform
        run: terraform -chdir="$TF_WORKING_DIR" init -input=false

      - name: Create reviewed plan
        run: |
          terraform -chdir="$TF_WORKING_DIR" plan \
            -input=false \
            -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            -out=${{ inputs.environment || 'nonprod' }}.tfplan

      - name: Add plan to workflow summary
        run: |
          echo "## Terraform plan - ${{ inputs.environment || 'nonprod' }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```terraform' >> "$GITHUB_STEP_SUMMARY"
          terraform -chdir="$TF_WORKING_DIR" show -no-color "${{ inputs.environment || 'nonprod' }}.tfplan" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reviewed plan
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-${{ inputs.environment || 'nonprod' }}-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}/${{ inputs.environment || 'nonprod' }}.tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Terraform apply (manual)
    if: github.event_name == 'workflow_dispatch'
    needs:
      - validate
      - plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'nonprod' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate manual confirmation
        if: inputs.confirmation != format('apply-{0}', inputs.environment)
        run: |
          echo "Invalid confirmation. Enter apply-${{ inputs.environment }} to authorize the deployment."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize HCP Terraform
        run: terraform -chdir="$TF_WORKING_DIR" init -input=false

      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Apply reviewed plan
        run: terraform -chdir="$TF_WORKING_DIR" apply -input=false "${{ inputs.environment }}.tfplan"

      - name: Show Terraform outputs
        run: terraform -chdir="$TF_WORKING_DIR" output
