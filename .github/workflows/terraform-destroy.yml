name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type destroy-nonprod to confirm destruction"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-nonprod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: terraform/environments/nonprod
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

jobs:
  confirmation:
    name: Validate destruction confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation value
        env:
          DESTROY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$DESTROY_CONFIRMATION" != "destroy-nonprod" ]; then
            echo "Destruction refused. Enter exactly: destroy-nonprod" >&2
            exit 1
          fi

  destroy:
    name: Terraform destroy nonprod
    needs: confirmation
    runs-on: ubuntu-latest
    environment: nonprod

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize HCP Terraform
        run: terraform -chdir="$TF_WORKING_DIR" init -input=false

      - name: Create destruction plan
        run: |
          terraform -chdir="$TF_WORKING_DIR" plan \
            -destroy \
            -input=false \
            -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            -out=nonprod-destroy.tfplan

      - name: Add destruction plan to workflow summary
        run: |
          echo '## Terraform destruction plan - nonprod' >> "$GITHUB_STEP_SUMMARY"
          echo '```terraform' >> "$GITHUB_STEP_SUMMARY"
          terraform -chdir="$TF_WORKING_DIR" show -no-color nonprod-destroy.tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Apply destruction plan
        run: |
          terraform -chdir="$TF_WORKING_DIR" apply \
            -input=false \
            nonprod-destroy.tfplan
